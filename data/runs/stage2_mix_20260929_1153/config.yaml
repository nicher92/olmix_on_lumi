# Smoke test for mixture reuse: freeze the flag-option5 mix as "existing"
# and let the swarm vary one dataset (open_web_math, held out of the frozen JSON).
settings:
  max_tokens: 300000000      # small test run; raise for a real swarm
  repetition_factor: 5.0
  seed: 42

swarm:
  minimum_source_weight: 0.0001
  minimum_topic_weight: 0.0001
  source_temperature: 1.0
  min_source_strength: 1
  max_source_strength: 20
  existing_mix_file: "data/flag_frozen.json"
  topic_temperature: 0.5
  min_topic_strength: 0.01
  max_topic_strength: 5.0
  enable_bound: true
  manual_topic_prior: null
  manual_prior:
    existing: 0.95
    open_web_math: 0.05
  nonzero_weight:
    - existing
    - open_web_math

datasets:
  nemotron_cc_ha:
    paths: [/scratch/project_465002530/preprocessed/oellm-v1-256k/catalogue/nemotron-cc/1.0/10p-sample/nemotron-ha-10p-sample]
